name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python test_agent_upgrade.py
      - run: python -m json.tool .claude-plugin/plugin.json >/dev/null && python -m json.tool .claude-plugin/marketplace.json >/dev/null && python -m json.tool hooks/hooks.json >/dev/null
